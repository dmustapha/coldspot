<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="og-lamp" cx="0.74" cy="0.3" r="0.7">
      <stop offset="0" stop-color="oklch(78% 0.145 75)" stop-opacity="0.16"/>
      <stop offset="1" stop-color="oklch(78% 0.145 75)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-beam" x1="760" y1="470" x2="1030" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="oklch(78% 0.145 75)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="oklch(87% 0.12 80)" stop-opacity="0.9"/>
      <stop offset="1" stop-color="oklch(78% 0.145 75)" stop-opacity="0"/>
    </linearGradient>
    <pattern id="og-rule" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="oklch(94% 0.008 220)" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="oklch(16% 0.012 235)"/>
  <rect width="1200" height="630" fill="url(#og-rule)"/>
  <rect width="1200" height="630" fill="url(#og-lamp)"/>

  <!-- left column: eyebrow + wordmark + thesis -->
  <text x="90" y="150" font-family="'Spline Sans Mono', ui-monospace, monospace" font-size="20" letter-spacing="4.4" fill="oklch(78% 0.145 75)">COVERAGE DISCOVERY AGENT</text>
  <text x="86" y="250" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="-3.5" fill="oklch(94% 0.008 220)">COLDSPOT</text>
  <text x="90" y="340" font-family="'Public Sans', system-ui, sans-serif" font-size="30" fill="oklch(72% 0.01 225)">Finds the one coverage fact</text>
  <text x="90" y="382" font-family="'Public Sans', system-ui, sans-serif" font-size="30" fill="oklch(72% 0.01 225)">the lamp cannot warm.</text>
  <!-- abstain chip -->
  <rect x="90" y="430" width="340" height="46" rx="6" fill="oklch(87% 0.055 215)" fill-opacity="0.10" stroke="oklch(87% 0.055 215)" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  <rect x="112" y="447" width="12" height="12" rx="2" fill="none" stroke="oklch(87% 0.055 215)" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="136" y="461" font-family="'Spline Sans Mono', ui-monospace, monospace" font-size="18" letter-spacing="3" fill="oklch(87% 0.055 215)">ABSTAIN · MISSING FACT NAMED</text>

  <!-- right: the big lattice with the cold cell -->
  <g transform="translate(748, 150)">
    <!-- cell 92, gap 26, origin 0 -> spans 0..328 -->
    <rect x="0"   y="0"   width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.52"/>
    <rect x="118" y="0"   width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.80"/>
    <rect x="236" y="0"   width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.44"/>
    <rect x="0"   y="118" width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.92"/>
    <rect x="118" y="118" width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.60"/>
    <!-- cold cell -->
    <rect x="236" y="118" width="92" height="92" rx="18" fill="oklch(13% 0.014 230)"/>
    <rect x="236" y="118" width="92" height="92" rx="18" fill="none" stroke="oklch(87% 0.055 215)" stroke-width="3" stroke-dasharray="10 7"/>
    <rect x="226" y="108" width="112" height="112" rx="24" fill="none" stroke="oklch(87% 0.055 215)" stroke-opacity="0.4" stroke-width="2.5"/>
    <rect x="0"   y="236" width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.46"/>
    <rect x="118" y="236" width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.84"/>
    <rect x="236" y="236" width="92" height="92" rx="18" fill="oklch(78% 0.145 75)" fill-opacity="0.56"/>
    <line x1="-12" y1="340" x2="340" y2="-12" stroke="url(#og-beam)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
